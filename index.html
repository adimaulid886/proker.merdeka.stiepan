<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perawatan Genset - STIEPAN</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @media print {
            /* Sembunyikan semua elemen saat di-print */
            body * {
                visibility: hidden;
            }
            /* Tampilkan hanya area print */
            #print-area, #print-area * {
                visibility: visible;
            }
            #print-area {
                position: absolute;
                left: 0;
                top: 0;
                width: 100%;
            }
            /* Sembunyikan kolom aksi dan tombol saat print */
            .no-print {
                display: none !important;
            }
            /* Atur ulang gaya tabel untuk print agar garisnya jelas (hitam putih) */
            table {
                border-collapse: collapse;
                width: 100%;
                margin-top: 20px;
            }
            th, td {
                border: 1px solid black !important;
                padding: 8px;
                text-align: left;
                color: black !important;
            }
            h1, h2 {
                color: black !important;
                text-align: center;
                margin-bottom: 20px;
            }
        }
    </style>
</head>
<body class="bg-gray-100 text-gray-800 font-sans p-4 md:p-8">

    <div class="max-w-5xl mx-auto bg-white p-6 md:p-10 rounded-lg shadow-lg">
        
        <!-- Header Aplikasi (Tidak ikut di-print, diganti header print) -->
        <div class="text-center mb-8 no-print">
            <h1 class="text-2xl md:text-3xl font-bold text-blue-700">Form Perawatan Genset</h1>
            <h2 class="text-lg md:text-xl font-semibold text-gray-600">Sekolah Tinggi Ilmu Ekonomi Balikpapan</h2>
        </div>

        <!-- Form Input -->
        <form id="gensetForm" class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-8 no-print bg-gray-50 p-6 rounded border">
            <div>
                <label class="block text-sm font-medium mb-1">Tanggal</label>
                <input type="date" id="tanggal" required class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:border-blue-500">
            </div>
            
            <div>
                <label class="block text-sm font-medium mb-1">Nama Petugas</label>
                <input type="text" id="nama" required placeholder="Masukkan nama" class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:border-blue-500">
            </div>

            <div>
                <label class="block text-sm font-medium mb-1">Jam Awal</label>
                <input type="time" id="jamAwal" required class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:border-blue-500">
            </div>

            <div>
                <label class="block text-sm font-medium mb-1">Jam Akhir</label>
                <input type="time" id="jamAkhir" required class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:border-blue-500">
            </div>

            <div class="md:col-span-2">
                <label class="block text-sm font-medium mb-1">Kondisi Genset</label>
                <select id="kondisi" required class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:border-blue-500">
                    <option value="Normal">Normal</option>
                    <option value="Bermasalah">Bermasalah</option>
                </select>
            </div>

            <div id="keteranganContainer" class="md:col-span-2 hidden">
                <label class="block text-sm font-medium mb-1">Keterangan Masalah</label>
                <textarea id="keterangan" rows="3" placeholder="Jelaskan masalah pada genset..." class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:border-blue-500"></textarea>
            </div>

            <div class="md:col-span-2 mt-4">
                <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded transition duration-200">
                    Simpan Data
                </button>
            </div>
        </form>

        <!-- Tombol Aksi -->
        <div class="flex justify-between mb-4 no-print">
            <h3 class="text-xl font-bold">Rekapan Perawatan</h3>
            <div>
                <button onclick="window.print()" class="bg-green-600 hover:bg-green-700 text-white font-bold py-2 px-4 rounded transition duration-200 mr-2 flex items-center inline-flex">
                    <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4a2 2 0 00-2-2H9a2 2 0 00-2 2v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z"></path></svg>
                    Print Tabel
                </button>
                <button onclick="hapusSemua()" class="bg-red-600 hover:bg-red-700 text-white font-bold py-2 px-4 rounded transition duration-200">
                    Hapus Semua
                </button>
            </div>
        </div>

        <!-- Area Print & Tabel -->
        <div id="print-area" class="overflow-x-auto">
            <!-- Header khusus print (Tersembunyi di layar normal, muncul saat di-print) -->
            <div class="hidden print:block text-center mb-6">
                <h1 style="font-size: 24px; font-weight: bold; margin-bottom: 5px;">LAPORAN PERAWATAN GENSET</h1>
                <h2 style="font-size: 20px; font-weight: bold;">SEKOLAH TINGGI ILMU EKONOMI BALIKPAPAN</h2>
                <hr style="border: 1px solid black; margin-top: 10px; margin-bottom: 20px;">
            </div>

            <table class="w-full table-auto border-collapse border border-gray-300">
                <thead class="bg-gray-200">
                    <tr>
                        <th class="border border-gray-300 px-4 py-2 text-center">No</th>
                        <th class="border border-gray-300 px-4 py-2">Tanggal</th>
                        <th class="border border-gray-300 px-4 py-2">Nama</th>
                        <th class="border border-gray-300 px-4 py-2 text-center">Jam Awal</th>
                        <th class="border border-gray-300 px-4 py-2 text-center">Jam Akhir</th>
                        <th class="border border-gray-300 px-4 py-2 text-center">Kondisi</th>
                        <th class="border border-gray-300 px-4 py-2">Keterangan</th>
                        <th class="border border-gray-300 px-4 py-2 text-center no-print">Aksi</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                    <!-- Data akan dirender di sini oleh JavaScript -->
                </tbody>
            </table>
        </div>

    </div>

    <script>
        // Inisialisasi variabel dan referensi elemen
        const form = document.getElementById('gensetForm');
        const kondisiSelect = document.getElementById('kondisi');
        const keteranganContainer = document.getElementById('keteranganContainer');
        const keteranganInput = document.getElementById('keterangan');
        const tableBody = document.getElementById('tableBody');

        // State data dari localStorage
        let dataPerawatan = JSON.parse(localStorage.getItem('dataGensetStiepan')) || [];

        // Logic untuk menampilkan form keterangan jika kondisi bermasalah
        kondisiSelect.addEventListener('change', function() {
            if (this.value === 'Bermasalah') {
                keteranganContainer.classList.remove('hidden');
                keteranganInput.required = true;
            } else {
                keteranganContainer.classList.add('hidden');
                keteranganInput.required = false;
                keteranganInput.value = '';
            }
        });

        // Fungsi menyimpan data baru
        form.addEventListener('submit', function(e) {
            e.preventDefault();

            const newData = {
                id: Date.now(),
                tanggal: document.getElementById('tanggal').value,
                nama: document.getElementById('nama').value,
                jamAwal: document.getElementById('jamAwal').value,
                jamAkhir: document.getElementById('jamAkhir').value,
                kondisi: document.getElementById('kondisi').value,
                keterangan: document.getElementById('keterangan').value || '-'
            };

            dataPerawatan.push(newData);
            simpanData();
            renderTable();
            form.reset();
            kondisiSelect.dispatchEvent(new Event('change')); // Reset tampilan keterangan
        });

        // Fungsi render tabel
        function renderTable() {
            tableBody.innerHTML = '';
            
            if (dataPerawatan.length === 0) {
                tableBody.innerHTML = `
                    <tr>
                        <td colspan="8" class="text-center py-4 text-gray-500 italic">Belum ada data rekapan.</td>
                    </tr>
                `;
                return;
            }

            dataPerawatan.forEach((data, index) => {
                // Formatting tanggal (Opsional: ubah format YYYY-MM-DD ke format lokal)
                const dateObj = new Date(data.tanggal);
                const formatTanggal = dateObj.toLocaleDateString('id-ID', {
                    day: '2-digit', month: 'short', year: 'numeric'
                });

                const kondisiStyle = data.kondisi === 'Normal' 
                    ? '<span class="bg-green-100 text-green-800 px-2 py-1 rounded text-xs font-semibold">Normal</span>' 
                    : '<span class="bg-red-100 text-red-800 px-2 py-1 rounded text-xs font-semibold">Bermasalah</span>';

                const tr = document.createElement('tr');
                tr.classList.add('hover:bg-gray-50');
                tr.innerHTML = `
                    <td class="border border-gray-300 px-4 py-2 text-center">${index + 1}</td>
                    <td class="border border-gray-300 px-4 py-2 whitespace-nowrap">${formatTanggal}</td>
                    <td class="border border-gray-300 px-4 py-2">${data.nama}</td>
                    <td class="border border-gray-300 px-4 py-2 text-center">${data.jamAwal}</td>
                    <td class="border border-gray-300 px-4 py-2 text-center">${data.jamAkhir}</td>
                    <td class="border border-gray-300 px-4 py-2 text-center">${kondisiStyle}</td>
                    <td class="border border-gray-300 px-4 py-2">${data.keterangan}</td>
                    <td class="border border-gray-300 px-4 py-2 text-center no-print">
                        <button onclick="hapusData(${data.id})" class="text-red-500 hover:text-red-700" title="Hapus Data">
                            <svg class="w-5 h-5 mx-auto" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                        </button>
                    </td>
                `;
                tableBody.appendChild(tr);
            });
        }

        // Fungsi untuk menghapus 1 baris data
        function hapusData(id) {
            if (confirm('Apakah Anda yakin ingin menghapus data ini?')) {
                dataPerawatan = dataPerawatan.filter(item => item.id !== id);
                simpanData();
                renderTable();
            }
        }

        // Fungsi menghapus semua data
        function hapusSemua() {
            if (dataPerawatan.length > 0) {
                if (confirm('PERINGATAN: Semua data rekapan akan dihapus. Lanjutkan?')) {
                    dataPerawatan = [];
                    simpanData();
                    renderTable();
                }
            } else {
                alert('Tidak ada data untuk dihapus.');
            }
        }

        // Simpan state ke LocalStorage
        function simpanData() {
            localStorage.setItem('dataGensetStiepan', JSON.stringify(dataPerawatan));
        }

        // Render tabel pertama kali saat halaman dimuat
        renderTable();

    </script>
</body>
</html>
